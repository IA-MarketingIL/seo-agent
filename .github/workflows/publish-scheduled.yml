name: Daily scheduled publish
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish due articles
        run: |
          curl --fail-with-body -sS -X POST \
            "https://seo-agent-3jx.pages.dev/api/publish-scheduled" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
